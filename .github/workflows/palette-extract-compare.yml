name: Palette extraction alternatives

on:
  push:
    branches: ['feat/**']
    paths:
      - 'src/palette.rs'
      - 'examples/bench_palette_extract.rs'
      - '.github/workflows/palette-extract-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Native A/B / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux x86-64
            runner: ubuntu-24.04
          - os: macOS ARM64
            runner: macos-15
          - os: Windows MSVC
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Capture compiler and platform
        run: rustc +1.99.1 --version --verbose
      - name: Compare exact outputs, work and release timings
        run: cargo +1.99.1 run --release --locked --offline --example bench_palette_extract
