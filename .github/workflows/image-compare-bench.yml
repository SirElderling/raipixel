name: Image comparison A/B

on:
  push:
    branches: ['feat/**']
    paths:
      - 'src/compare.rs'
      - 'examples/bench_image_compare.rs'
      - '.github/workflows/image-compare-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Image diff / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux x86_64
            runner: ubuntu-24.04
          - os: macOS ARM64
            runner: macos-15
          - os: Windows MSVC
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Compiler identification
        run: rustc +1.99.1 --version --verbose
      - name: Check benchmark formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Compare identical tasks with exact work and output
        run: cargo +1.99.1 run --release --locked --offline --example bench_image_compare
