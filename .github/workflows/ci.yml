name: Rust CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  native:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macOS
            runner: macos-15
            target: aarch64-apple-darwin
          - os: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Toolchain details
        run: rustc +stable --version --verbose
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test natively
        run: cargo +stable test --locked --offline --target ${{ matrix.target }}
      - name: Clippy
        run: cargo +stable clippy --locked --offline --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Compare checksum throughput (informational)
        run: |
          rustc +stable --edition=2024 -O tools/png_checksum_bench.rs -o png-checksum-bench.exe
          ./png-checksum-bench.exe
      - name: Paired full-codec timings and exact output comparison (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_timings.py --baseline 9122259844497a57149dbe6ba7fa0ef708398c46 --batch-ms 100 --output png-timings.json
      - name: Compare original mixed-filter corpus, samples, flags and work (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_timings.py --baseline 9122259844497a57149dbe6ba7fa0ef708398c46 --corpus benchmarks/png/original-inputs.json --batch-ms 100 --output png-original-timings.json
      - name: Restore recorded original PNG inputs
        run: python -c "import json;from pathlib import Path;p=Path('png-original-inputs');p.mkdir(exist_ok=True);[(p / (c['name'] + '.png')).write_bytes(bytes.fromhex(c['png_hex'])) for c in json.loads(Path('benchmarks/png/original-inputs.json').read_text())['cases']]"
      - name: Codec stage probes (informational)
        run: |
          cargo +stable run --release --locked --offline --example png_bench -- --export png-stage-inputs
          cargo +stable run --release --locked --offline --example png_stages -- png-stage-inputs/sheet-1024-compressed.png
          cargo +stable run --release --locked --offline --example png_stages -- png-stage-inputs/texture-1024-compressed.png
      - name: Profile actual decoder stages (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_decode_stages.py png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png
      - name: Screen safe CRC slicing widths (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_crc_trial.py
      - name: Profile actual writer stages (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_writer_profile.py png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png
      - name: Screen token emission separately from matching (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_token_replay.py png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-stage-inputs/noise-256-compressed.png
      - name: Compare matching and Adler stages against baseline (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_bottleneck_compare.py --baseline 27243e606e9c5c3ef6fddc0c645255570be75be7 png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-stage-inputs/noise-256-compressed.png
      - name: Compare complete codecs under matched build profiles (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_build_profiles.py --output png-build-profiles.json png-stage-inputs/icon-64-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-stage-inputs/noise-256-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png
