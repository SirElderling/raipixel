name: Rust CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  native:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macOS
            runner: macos-15
            target: aarch64-apple-darwin
          - os: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Toolchain details
        run: rustc +stable --version --verbose
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test natively
        run: cargo +stable test --locked --offline --target ${{ matrix.target }}
      - name: Clippy
        run: cargo +stable clippy --locked --offline --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Compare checksum throughput (informational)
        run: |
          rustc +stable --edition=2024 -O tools/png_checksum_bench.rs -o png-checksum-bench.exe
          ./png-checksum-bench.exe
      - name: Paired full-codec timings and exact output comparison (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python tools/png_timings.py --baseline 68ee8a64b331b5034239809edb405ee448c3162b --output png-timings.json
      - name: Codec stage probes (informational)
        run: |
          cargo +stable run --release --locked --offline --example png_bench -- --export png-stage-inputs
          cargo +stable run --release --locked --offline --example png_stages -- png-stage-inputs/sheet-1024-compressed.png
          cargo +stable run --release --locked --offline --example png_stages -- png-stage-inputs/texture-1024-compressed.png
      - name: Screen filter/checksum and match candidates (informational)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustc +stable --edition=2024 -O tools/png_filter_adler_trial.rs -o png-filter-adler-trial.exe
          ./png-filter-adler-trial.exe
          python tools/png_match_trial.py png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-stage-inputs/noise-256-compressed.png
          python tools/png_decoder_profile.py --recompress png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png
