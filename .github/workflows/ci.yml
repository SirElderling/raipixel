name: Rust CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  native:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macOS
            runner: macos-15
            target: aarch64-apple-darwin
          - os: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Toolchain details
        run: rustc +stable --version --verbose
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test natively
        run: cargo +stable test --locked --offline --target ${{ matrix.target }}
      - name: Clippy
        run: cargo +stable clippy --locked --offline --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Compare checksum throughput (informational)
        run: |
          rustc +stable --edition=2024 -O tools/png_checksum_bench.rs -o png-checksum-bench.exe
          ./png-checksum-bench.exe
      - name: Paired full-codec timings and exact output comparison (informational)
        run: python tools/png_timings.py --baseline 8db027502117700bfbd3d18c845d5e77a755fdb1 --output png-timings.json
