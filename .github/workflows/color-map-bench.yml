name: Color-map algorithm comparison

on:
  push:
    branches: ['feat/**']
    paths:
      - 'examples/bench_color_map.rs'
      - 'src/color_edit.rs'
      - '.github/workflows/color-map-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: RGB mapping / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux x86_64
            runner: ubuntu-24.04
          - os: macOS ARM64
            runner: macos-15
          - os: Windows MSVC
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compare exact RGB output and release performance
        run: cargo +1.99.1 run --release --locked --offline --example bench_color_map
