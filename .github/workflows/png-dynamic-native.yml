name: PNG dynamic Huffman native trial

on:
  push:
    branches: [feat/raster-foundation]
    paths-ignore:
      - benchmarks/png/experiment-register.md
  workflow_dispatch:

permissions:
  contents: read

# Only the newest branch revision should run resource-intensive scratch trials.
concurrency:
  group: png-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Dynamic Huffman / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-2022
          - os: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install exact Rust compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler verification
        run: rustc +1.99.1 --version --verbose
      - name: Export deterministic compressed PNGs
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: cargo run --release --locked --offline --example png_bench -- --export png-stage-inputs
      - name: Restore independent mixed-filter corpus
        run: python -c "import json;from pathlib import Path;p=Path('png-original-inputs');p.mkdir(exist_ok=True);[(p / (c['name'] + '.png')).write_bytes(bytes.fromhex(c['png_hex'])) for c in json.loads(Path('benchmarks/png/original-inputs.json').read_text())['cases']]"
      - name: Match indexed PNG against png 0.18.1 public writer
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_indexed_reference.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png
      - name: Measure indexed PNG filter size ceiling (diagnostic; verify exact RGBA)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_compression_ceiling.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/sheet-1024-compressed.png png-original-inputs/comparison-sheet-1024.png

      - name: Benchmark streaming indexed Sub filter (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_indexed_sub_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-original-inputs/comparison-sheet-1024.png

      - name: Cross-block 32 KiB history and bounded 1/8/16-chain match screen
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_history_native_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/sheet-1024-compressed.png png-original-inputs/comparison-sheet-1024.png

      - name: Test deeper 16/32/64 LZ history and mixed PNG filter choices (fully verified)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_quality_mix_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-original-inputs/comparison-sheet-1024.png

      - name: Test frequency-ordered exact RGBA palettes against existing indexed writer
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_palette_frequency_native_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/sheet-1024-compressed.png png-original-inputs/comparison-sheet-1024.png

      - name: Native safe Rust dynamic-Huffman size, speed and correctness
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_native_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png

      - name: Compare single-pass token-buffered dynamic Huffman (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_single_pass_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png

      - name: Screen binary-heap Huffman tree construction (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_heap_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png

      - name: Test compact 16-bit tokens with heap Huffman construction (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_packed_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png

      - name: Combine indexed-color PNG and dynamic Huffman (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_indexed_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png

      - name: Skip dynamic Huffman on small indexed blocks (informational)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python tools/png_dynamic_indexed_guard_trial.py png-stage-inputs/icon-64-compressed.png png-stage-inputs/noise-256-compressed.png png-stage-inputs/sheet-1024-compressed.png png-stage-inputs/texture-1024-compressed.png png-original-inputs/comparison-sheet-1024.png png-original-inputs/comparison-texture-1024.png
